server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Missing assets must return 404, not the SPA HTML document.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /audio/ {
        try_files $uri =404;
        expires 7d;
    }

    location /generated/ {
        try_files $uri =404;
        expires 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
